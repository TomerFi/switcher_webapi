[project]
name = "switcher_webapi"
version = "2.5.5.dev1"
description = "Web service for controlling Switcher smart devices"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "aioswitcher==6.4.0",
    "aiohttp==3.14.5",
]

[dependency-groups]
dev = [
    "assertpy==2.35.0",
    "ty==0.0.97",
    "prek==0.5.10",
    "pytest==9.2.0",
    "pytest-aiohttp==1.1.1",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "pytest-sugar==1.1.1",
    "ruff==0.17.3",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-git-revision-date-plugin==0.3.2",
    "mkdocs-material==9.8.0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*.py" = ["E501", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]

[tool.coverage.report]
fail_under = 85.00
precision = 2
skip_covered = true
exclude_lines = ["if __name__ == \"__main__\":"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
