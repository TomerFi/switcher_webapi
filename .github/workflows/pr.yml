---
name: Pull request build

on:
  pull_request:
#    branches:
#      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.number }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.13"

jobs:
  build-app:
    runs-on: ubuntu-latest
    name: Build project
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-install-project --group dev --locked

      - name: Lint project
        run: |
          uv run --locked ruff check
          uv run --locked ruff format --check
          uv run --locked ty check

      - name: Ensure assistant files are linked
        uses: tomerfi/aicfg/link@7a71c5c7e0d8d9ebdd4a2e9212c9bb04a49c687f # 0.2.0
        with:
          source: agents
          target: claude-code

      - name: Test project
        run: uv run --locked pytest -v --cov --cov-report=xml:coverage.xml --junit-xml junit.xml

      - name: Report test summary
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          test_changes_limit: 0
          files: ./junit.xml
          report_individual_runs: true

      - name: Push to CodeCov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml

  build-docker:
    runs-on: ubuntu-latest
    name: Build docker
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hadolint Dockerfile
        id: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Get current date
        id: getDate
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.getDate.outputs.date }}
            VERSION=testing
          tags: tomerfi/switcher_webapi:testing
          cache-from: type=gha,key=switcher-webapi-cache
          cache-to: type=gha,key=switcher-webapi-cache,mode=max

  e2e-smoke-test:
    needs: build-docker
    runs-on: ubuntu-latest
    name: E2E smoke test
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: switcher_webapi:test
          cache-from: type=gha,key=switcher-webapi-cache
          cache-to: type=gha,key=switcher-webapi-cache,mode=max

      - name: Run container and test health endpoint
        run: |
          docker run -d --name test-container -p 8000:8000 switcher_webapi:test
          for _ in {1..12}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            [ "$response" = "200" ] && break
            sleep 5
          done
          docker logs test-container
          docker stop test-container
          if [ "$response" != "200" ]; then
            echo "Health check failed with status $response"
            exit 1
          fi
          echo "Health check passed with status $response"
