---
name: Release

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Release title"
        required: false
      bump:
        description: "Bump type (major/minor/patch) defaults to auto"
        default: "auto"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
          - auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: deployment
    name: Build, publish, release, and announce
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Hadolint Dockerfile
        id: hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup SSH signing
        run: |
          mkdir -p $RUNNER_TEMP
          echo "${{ secrets.SIGNING_KEY }}" > $RUNNER_TEMP/signing_key
          chmod 600 $RUNNER_TEMP/signing_key
          git config gpg.format ssh
          git config user.signingkey $RUNNER_TEMP/signing_key
          git config commit.gpgsign true

      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements_docs.txt

      - name: Prepare python environment
        run: |
          pip install -r requirements.txt -r requirements_docs.txt

      - name: Build documentation site
        run: mkdocs build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Determine next SemVer
        id: bumper
        uses: tomerfi/version-bumper-action@16cb52d294eba8bd3e8757a2569ff6fafd94f52c # 2.0.8
        with:
          bump: '${{ github.event.inputs.bump }}'

      - name: Set new project version
        # yamllint disable rule:line-length
        # editorconfig-checker-disable
        env:
          NEXT_VERSION: ${{ steps.bumper.outputs.next }}
        run: |
          echo "$NEXT_VERSION" > VERSION
          sed -i "s/  version: .*/  version: \"$NEXT_VERSION\"/g" mkdocs.yml
        # yamllint enable rule:line-length
        # editorconfig-checker-enable

      - name: Commit, tag, and push
        env:
          NEXT_VERSION: ${{ steps.bumper.outputs.next }}
        run: |
          git add VERSION
          git add mkdocs.yml
          git commit -m "build: bump version to $NEXT_VERSION"
          git push

      - name: Get current date
        id: current_date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build images and push to DockerHub
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          tags: |
            tomerfi/switcher_webapi:latest
            tomerfi/switcher_webapi:${{ steps.bumper.outputs.next }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.current_date.outputs.date }}
            VERSION=${{ steps.bumper.outputs.next }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create a release name
        id: release_name
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEXT_VERSION: ${{ steps.bumper.outputs.next }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
        with:
          script: |
            var retval = process.env.NEXT_VERSION
            if (process.env.INPUT_TITLE) {
              retval = retval.concat(' - ' + process.env.INPUT_TITLE)
            }
            core.setOutput('value', retval)

      - name: Create a release
        id: gh_release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEXT_VERSION: ${{ steps.bumper.outputs.next }}
          RELEASE_NAME: ${{ steps.release_name.outputs.value }}
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const repo_name = context.payload.repository.full_name
            const response = await github.request('POST /repos/' + repo_name + '/releases', {
              tag_name: process.env.NEXT_VERSION,
              name: process.env.RELEASE_NAME,
              generate_release_notes: true
            })
            core.setOutput('html_url', response.data.html_url)

      - name: Set development project version
        env:
          DEV_VERSION: ${{ steps.bumper.outputs.dev }}
        run: echo "$DEV_VERSION" > VERSION

      - name: Commit and push
        # yamllint disable rule:line-length
        # editorconfig-checker-disable
        env:
          DEV_VERSION: ${{ steps.bumper.outputs.dev }}
        run: |
          git add VERSION
          git commit -m "build: bump version to $DEV_VERSION [skip ci]"
          git push
        # yamllint enable rule:line-length
        # editorconfig-checker-enable

