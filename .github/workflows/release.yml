---
name: Release

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Release title"
        required: false
      bump:
        description: "Bump type (major/minor/patch) defaults to auto"
        default: "auto"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: deployment
    name: Build, publish, release, and announce
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup SSH signing
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SIGNING_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/signing_key
          git config commit.gpgsign true

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements_docs.txt

      - name: Prepare python environment
        run: |
          pip install -r requirements.txt -r requirements_docs.txt

      - name: Build documentation site
        run: mkdocs build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to DockerHub
        uses: docker/login-action@v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Determine next SemVer
        id: bumper
        uses: tomerfi/version-bumper-action@2.0.7
        with:
          bump: '${{ github.event.inputs.bump }}'

      - name: Set new project version
        # yamllint disable rule:line-length
        # editorconfig-checker-disable
        env:
          NEXT_VERSION: ${{ steps.bumper.outputs.next }}
        run: |
          echo "$NEXT_VERSION" > VERSION
          sed -i "s/  version: .*/  version: \"$NEXT_VERSION\"/g" mkdocs.yml
        # yamllint enable rule:line-length
        # editorconfig-checker-enable

      - name: Commit, tag, and push
        env:
          NEXT_VERSION: ${{ steps.bumper.outputs.next }}
        run: |
          git add VERSION
          git add mkdocs.yml
          git commit -m "build: bump version to $NEXT_VERSION"
          git push

      - name: Get current date
        id: current_date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build images and push to DockerHub
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          tags: |
            tomerfi/switcher_webapi:latest
            tomerfi/switcher_webapi:${{ steps.bumper.outputs.next }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.current_date.outputs.date }}
            VERSION=${{ steps.bumper.outputs.next }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create a release name
        id: release_name
        uses: actions/github-script@v8
        env:
          NEXT_VERSION: ${{ steps.bumper.outputs.next }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
        with:
          script: |
            var retval = process.env.NEXT_VERSION
            if (process.env.INPUT_TITLE) {
              retval = retval.concat(' - ' + process.env.INPUT_TITLE)
            }
            core.setOutput('value', retval)

      - name: Create a release
        id: gh_release
        uses: actions/github-script@v8
        env:
          NEXT_VERSION: ${{ steps.bumper.outputs.next }}
          RELEASE_NAME: ${{ steps.release_name.outputs.value }}
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const repo_name = context.payload.repository.full_name
            const response = await github.request('POST /repos/' + repo_name + '/releases', {
              tag_name: process.env.NEXT_VERSION,
              name: process.env.RELEASE_NAME,
              generate_release_notes: true
            })
            core.setOutput('html_url', response.data.html_url)

      - name: Set development project version
        env:
          DEV_VERSION: ${{ steps.bumper.outputs.dev }}
        run: echo "$DEV_VERSION" > VERSION

      - name: Commit and push
        # yamllint disable rule:line-length
        # editorconfig-checker-disable
        env:
          DEV_VERSION: ${{ steps.bumper.outputs.dev }}
        run: |
          git add VERSION
          git commit -m "build: bump version to $DEV_VERSION [skip ci]"
          git push
        # yamllint enable rule:line-length
        # editorconfig-checker-enable

      - name: Cleanup SSH signing key
        if: always()
        run: rm -f ~/.ssh/signing_key
