---
name: Release

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Release title"
        required: false
      bump:
        description: "Bump type (major/minor/patch) defaults to auto"
        default: "auto"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
          - auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_PYTHON: "3.13"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: deployment
    name: Build, publish, release, and announce
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Hadolint Dockerfile
        id: hadolint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup SSH signing
        run: |
          mkdir -p "$RUNNER_TEMP"
          echo "${{ secrets.SIGNING_KEY }}" > "$RUNNER_TEMP/signing_key"
          chmod 600 "$RUNNER_TEMP/signing_key"
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/signing_key"
          git config commit.gpgsign true

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-install-project --group dev --group docs

      - name: Build documentation site
        run: uv run --locked mkdocs build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Determine next SemVer
        id: bumper
        uses: tomerfi/version-bumper-action@2d160ea4d1b4e1bc5534c9eece726a1227b19afd # 2.0.9
        with:
          bump: '${{ github.event.inputs.bump }}'

      - name: Set new project version
        id: uv_new
        env:
          NEXT_VERSION: '${{ steps.bumper.outputs.next }}'
        run: |
          if [ "${{ github.event.inputs.bump }}" == "auto" ];
          then jq_output=$(uv version --output-format json --bump stable "$NEXT_VERSION");
          elif [ "${{ github.event.inputs.bump }}" == "patch" ];
          then jq_output=$(uv version --output-format json --bump stable);
          else jq_output=$(uv version --output-format json --bump "${{ github.event.inputs.bump }}"); fi
          echo "version=$(echo "$jq_output" | jq -r '.version')" >> "$GITHUB_OUTPUT"

      - name: Update mkdocs.yml version
        run: |
          sed -i "s/  version: .*/  version: \"${{ steps.uv_new.outputs.version }}\"/" mkdocs.yml

      - name: Commit, tag, and push
        env:
          NEXT_VERSION: '${{ steps.uv_new.outputs.version }}'
        run: |
          git add pyproject.toml mkdocs.yml
          git commit -m "build: bump version to $NEXT_VERSION [skip ci]"
          git push

      - name: Get current date
        id: current_date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build images and push to DockerHub
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          tags: |
            tomerfi/switcher_webapi:latest
            tomerfi/switcher_webapi:${{ steps.bumper.outputs.next }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.current_date.outputs.date }}
            VERSION=${{ steps.bumper.outputs.next }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create a release name
        id: release_name
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEXT_VERSION: ${{ steps.bumper.outputs.next }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
        with:
          script: |
            var retval = process.env.NEXT_VERSION
            if (process.env.INPUT_TITLE) {
              retval = retval.concat(' - ' + process.env.INPUT_TITLE)
            }
            core.setOutput('value', retval)

      - name: Create a release
        id: gh_release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEXT_VERSION: ${{ steps.bumper.outputs.next }}
          RELEASE_NAME: ${{ steps.release_name.outputs.value }}
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const repo_name = context.payload.repository.full_name
            const response = await github.request('POST /repos/' + repo_name + '/releases', {
              tag_name: process.env.NEXT_VERSION,
              name: process.env.RELEASE_NAME,
              generate_release_notes: true
            })
            core.setOutput('html_url', response.data.html_url)

      - name: Set development project version
        id: uv_dev
        run: |
          echo "version=$(uv version --output-format json --bump patch --bump dev | jq -r '.version')" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        env:
          DEV_VERSION: '${{ steps.uv_dev.outputs.version }}'
        run: |
          git add pyproject.toml
          git commit -m "build: bump version to $DEV_VERSION [skip ci]"
          git push
