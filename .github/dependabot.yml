---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
    labels:
      - "type: dependencies"
    commit-message:
      prefix: "ci"
    rebase-strategy: disabled
    assignees:
      - "tomerfi"
      - "dmatik"
      - "YogevBokobza"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "type: dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    rebase-strategy: disabled
    versioning-strategy: increase-if-necessary
    assignees:
      - "tomerfi"
      - "dmatik"
      - "YogevBokobza"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "type: dependencies"
    commit-message:
      prefix: "build"
    rebase-strategy: disabled
    assignees:
      - "tomerfi"
      - "dmatik"
      - "YogevBokobza"
