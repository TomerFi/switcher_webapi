---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "dev"]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb  # frozen: v0.16.8
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 24cb944c372f536967c7f09b62552e7221f84363  # frozen: v0.0.81
    hooks:
      - id: ty

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: e8b4e28241a9ae8296ba6e4a491b5da4eda73283  # frozen: 3.11.1
    hooks:
      - id: editorconfig-checker

  - repo: https://github.com/TomerFi/aicfg
    rev: 7a71c5c7e0d8d9ebdd4a2e9212c9bb04a49c687f  # frozen: 0.2.0
    hooks:
      - id: link
        args: ["agents", "--to", "claude-code"]

  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505  # frozen: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: eec2b3c4f52295313b08b04f928ab2479e468b5c  # frozen: 0.12.15
    hooks:
      - id: uv-lock
